[env]
_.file = [{ path = "~/.env" }, { path = "~/.env.local", required = false }]
# mise-nix must only contribute PATH entries. PostgreSQL injects build flags
# that break Rust builds.
MISE_NIX_ENV_MODE = "path-only"

[settings]
experimental = true
minimum_release_age = "1d"
idiomatic_version_file_enable_tools = ["node"]

[settings.github]
# gh keeps its token in the OS keyring, which gh_cli_tokens (hosts.yml) cannot
# read. Without a token, github: and aqua: installs hit the API rate limit.
credential_command = "gh auth token"

[plugins]
nix = "https://github.com/jbadeau/mise-nix.git"
vite-plus = "https://github.com/markmals/mise-vite-plus"

[tools]
python = "3.14"
uv = "latest"
"pipx:basedpyright" = "latest"
"pipx:ruff" = "latest"

rust = "latest"

dotnet = "10"

vite-plus = "latest"
node = "22"
bun = "latest"
"npm:corepack" = "latest"
"npm:pnpm" = "latest"
"npm:typescript" = "latest"

# LSPs
# TODO: only needed for `tsgo --lsp` (TS7 language server). Stable typescript@7
# ships tsc but no LSP binary yet — drop this once TS 7.1 (~Oct 2026) folds the
# language server into the main `typescript` package. Referenced by opencode.json.
"npm:@typescript/native-preview" = "7.0.0-dev.20260707.2"
"npm:@tailwindcss/language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"github:LuaLS/lua-language-server" = "3.19.1"
"npm:markdownlint-cli2" = "latest"
"npm:oxfmt" = "latest"
"github:JohnnyMorganz/StyLua" = "latest"
"github:tamasfe/taplo" = "latest"
tflint = "0.64.0"
hadolint = "2.15.1"
"npm:jsonlint" = "1.6.3"
shellcheck = "latest"

# Shell
"github:herdrdev/herdr" = "0.9.3"
"oh-my-posh" = "latest"

# AI
