monorepo_root = true

[settings]
experimental = true

[tools]
node = "24"

[monorepo]
config_roots = ["tools/*"]

[shell_alias]
dots = "cd {{config_root}}"

[tasks.install]
description = "Install all dotfiles tools"
depends = ["//tools/...:install"]

[tasks.check]
description = "Run all checks"
depends = ["//tools/...:check"]

[tasks.apply]
description = "Apply dotfiles with chezmoi"
run = "chezmoi apply"
